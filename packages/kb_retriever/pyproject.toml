[project]
name = "kb-retriever"
version = "0.1.1"
description = "Knowledge base retrieval component using LlamaIndex and Pinecone"
readme = "README.md"
authors = [
    { name = "namish800", email = "namishpruthi800@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.12.40",
    "llama-index-vector-stores-pinecone>=0.4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_retriever"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
